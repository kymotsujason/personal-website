name: Privacy scan, check, and build

on: push

permissions:
  contents: read

jobs:
  scan-check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # a failed step would skip the steps after it, so each check runs whatever the others do. the scan needs only node
      # and git and goes first, before the pnpm setup and its cache can fail, since the next push's range starts where
      # this one ends
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/privacy/check.mjs --range "$BEFORE" "$AFTER"
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
      # pnpm's version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        id: install
        if: ${{ !cancelled() }}
      # the ghost import's contact sheet test renders in chromium, and the runner has no playwright browsers
      - run: pnpm -C apps/web exec playwright install --with-deps --only-shell chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # the privacy and tools suites, then the web app's format, lint, types, and unit tests
      - run: pnpm check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # the build ends with the html rules and the privacy check on dist
      - run: pnpm -C apps/web build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
